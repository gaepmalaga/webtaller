# ==========================================================================
# Despliega el recolector de números de Taberna Lázaro en Cloudflare Workers.
#
# Lo hace TODO: crea el almacén si no existe, mete la clave de lectura, sube
# el Worker y escribe su dirección en datos/contenido.json, con lo que la
# analítica queda encendida sin tocar nada más.
#
# Para que funcione hacen falta dos secretos del repositorio
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   CLOUDFLARE_API_TOKEN   Un token de Cloudflare con permiso para editar
#                          Workers y KV. Se saca en dash.cloudflare.com →
#                          My Profile → API Tokens → Create Token →
#                          plantilla «Edit Cloudflare Workers».
#   ANALITICA_CLAVE        Una contraseña larga que te inventes. Es la que
#                          pedirá el panel para enseñarte los números.
#
# Y, si tu cuenta tiene varias organizaciones, también CLOUDFLARE_ACCOUNT_ID.
#
# Sin esos secretos el trabajo se salta solo, sin fallar.
# ==========================================================================
name: Desplegar la analítica

on:
  workflow_dispatch:
  push:
    branches: [claude/fix-hidrocar-malaga-website-krgygu]
    paths:
      - 'herramientas/analitica/**'
      - '.github/workflows/analitica.yml'

permissions:
  contents: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que hay credenciales
        id: hay
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN: no hay nada que desplegar todavía." >> "$GITHUB_STEP_SUMMARY"
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ secrets.ANALITICA_CLAVE }}" ]; then
            echo "Falta el secreto ANALITICA_CLAVE (la contraseña para leer los números)." >> "$GITHUB_STEP_SUMMARY"
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hay.outputs.seguir == 'si'

      - uses: actions/setup-node@v4
        if: steps.hay.outputs.seguir == 'si'
        with: { node-version: '22' }

      - name: Instalar wrangler
        if: steps.hay.outputs.seguir == 'si'
        run: npm install -g wrangler@4

      # El almacén se busca por nombre; si no está, se crea. Así el flujo se
      # puede repetir las veces que haga falta sin duplicar nada.
      - name: Preparar el almacén de datos
        if: steps.hay.outputs.seguir == 'si'
        working-directory: herramientas/analitica
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ID=$(wrangler kv namespace list 2>/dev/null \
               | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                   try{ const j=JSON.parse(s.slice(s.indexOf("[")));
                        const n=j.find(x=>/lazaro-numeros-DATOS|DATOS/.test(x.title));
                        process.stdout.write(n?n.id:""); }catch(e){}
                 });' || true)
          if [ -z "$ID" ]; then
            echo "No había almacén: creando uno."
            SALIDA=$(wrangler kv namespace create DATOS)
            echo "$SALIDA"
            ID=$(printf '%s' "$SALIDA" | grep -oE '"?id"?[=: ]+"?[0-9a-f]{32}' | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then echo "::error::No se ha podido obtener el identificador del almacén"; exit 1; fi
          sed -i "s/RELLENADO_AL_DESPLEGAR/$ID/" wrangler.toml
          echo "Almacén: $ID"

      - name: Guardar la clave de lectura
        if: steps.hay.outputs.seguir == 'si'
        working-directory: herramientas/analitica
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' '${{ secrets.ANALITICA_CLAVE }}' | wrangler secret put CLAVE

      - name: Desplegar
        id: desplegar
        if: steps.hay.outputs.seguir == 'si'
        working-directory: herramientas/analitica
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee salida.txt
          URL=$(grep -oE 'https://[a-z0-9.-]*lazaro-numeros[a-z0-9.-]*\.workers\.dev' salida.txt | head -1)
          if [ -z "$URL" ]; then echo "::error::No se ha podido leer la dirección del Worker"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          rm -f salida.txt

      # Y aquí es donde se enciende de verdad: la dirección entra en el JSON
      # del que se genera la web.
      - name: Encender la analítica en la web
        if: steps.hay.outputs.seguir == 'si'
        env:
          URL: ${{ steps.desplegar.outputs.url }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const f = "taberna-lazaro/datos/contenido.json";
            const d = JSON.parse(fs.readFileSync(f, "utf8"));
            d.analitica = d.analitica || {};
            if (d.analitica.endpoint === process.env.URL) { console.log("ya estaba puesta"); process.exit(0); }
            d.analitica.endpoint = process.env.URL;
            fs.writeFileSync(f, JSON.stringify(d, null, 2) + "\n");
            console.log("puesta:", process.env.URL);
          '
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add taberna-lazaro/datos/contenido.json
            git commit -m "Analítica encendida: $URL"
            git push
          fi

      - name: Contarlo
        if: steps.hay.outputs.seguir == 'si'
        run: |
          {
            echo "## Analítica encendida"
            echo ""
            echo "- **Recolector:** ${{ steps.desplegar.outputs.url }}"
            echo "- La dirección ya está puesta en \`datos/contenido.json\`."
            echo "- En **/admin/ → Números**, la primera vez te pedirá la clave de lectura:"
            echo "  es el valor del secreto \`ANALITICA_CLAVE\`."
          } >> "$GITHUB_STEP_SUMMARY"
