# Publica la carpeta tal cual en GitHub Pages.
#
# Para que esto funcione hicieron falta dos cosas, una sola vez:
#
#   1. Repositorio público. Pages no está disponible en repositorios privados
#      con el plan gratuito. El `if` de abajo deja el trabajo en pausa si
#      volviese a ser privado, en lugar de fallar en cada push.
#   2. Activar Pages a mano en Settings -> Pages -> Source: GitHub Actions.
#      El `enablement: true` de abajo NO basta por sí solo: crear un sitio de
#      Pages desde cero exige permisos de administrador del repositorio, y el
#      GITHUB_TOKEN de Actions no los tiene. Sin ese paso manual falla con
#      "Create Pages site failed: Resource not accessible by integration".
#      Una vez creado el sitio, `enablement` ya no intenta crearlo y el
#      despliegue va solo en cada push.
name: Publicar en GitHub Pages

# Las dos ramas publican el repositorio entero, que ya contiene los dos
# sitios: Hidrocar en la raíz y Che Bolú en /che-bolu/. Publica la última que
# reciba un push, y como ambas llevan el mismo contenido el resultado es el
# mismo.
on:
  push:
    branches:
      - claude/fix-hidrocar-malaga-website-krgygu
      - claude/che-bolu-website-vxnsss
  workflow_dispatch:
  # Cuando la analítica se despliega sola y escribe su dirección en el JSON,
  # ese commit lo hace el propio GitHub y por eso no dispara un `push`. Así que
  # se escucha el final de aquel trabajo para republicar la web con la
  # analítica ya encendida.
  workflow_run:
    workflows: ["Desplegar la analítica"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # Si el repositorio fuese privado, Pages no estaría disponible: mejor
    # saltarse el trabajo que fallar.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # La web de Taberna Lázaro se genera a partir de datos/contenido.json,
      # que es lo que toca el panel de /admin/. Se reconstruye aquí para que lo
      # publicado siempre coincida con los datos, aunque el index.html del
      # repositorio se haya quedado atrás.
      - name: Generar la web de Taberna Lázaro
        run: node herramientas/construir-taberna.js

      - name: Rehacer los archivos de una sola página
        run: |
          python3 herramientas/construir-archivo-unico.py hidrocar
          python3 herramientas/construir-archivo-unico.py che-bolu
          python3 herramientas/construir-archivo-unico.py taberna-lazaro

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
