# Publica la carpeta tal cual en GitHub Pages.
#
# Para que esto funcione hicieron falta dos cosas, una sola vez:
#
#   1. Repositorio público. Pages no está disponible en repositorios privados
#      con el plan gratuito. El `if` de abajo deja el trabajo en pausa si
#      volviese a ser privado, en lugar de fallar en cada push.
#   2. Activar Pages a mano en Settings -> Pages -> Source: GitHub Actions.
#      El `enablement: true` de abajo NO basta por sí solo: crear un sitio de
#      Pages desde cero exige permisos de administrador del repositorio, y el
#      GITHUB_TOKEN de Actions no los tiene. Sin ese paso manual falla con
#      "Create Pages site failed: Resource not accessible by integration".
#      Una vez creado el sitio, `enablement` ya no intenta crearlo y el
#      despliegue va solo en cada push.
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/fix-hidrocar-malaga-website-krgygu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # Si el repositorio fuese privado, Pages no estaría disponible: mejor
    # saltarse el trabajo que fallar.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
