# Publica la carpeta tal cual en GitHub Pages.
#
# OJO: GitHub Pages NO funciona en repositorios privados con el plan gratuito.
# Mientras este repositorio sea privado el trabajo se salta solo (ver el `if`
# de abajo), para no llenar el correo de fallos. En cuanto se ponga en público,
# el siguiente push lo publica sin tocar nada más.
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/fix-hidrocar-malaga-website-krgygu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # Si el repositorio es privado, Pages no está disponible: nos saltamos el
    # trabajo en lugar de fallar. Al hacerlo público, esto pasa a ser cierto solo.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
